
name: Extract website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract website files into the site root
        run: |
          ZIP_FILE="Viralstrings_Contact_Form_Email_Updated.zip"
          test -f "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          test -f "index.html"

      - name: Commit extracted website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract website files for Netlify deployment"
            git push
          else
            echo "No extracted website changes to commit."
          fi
